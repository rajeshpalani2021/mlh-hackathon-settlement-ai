spring:
  application:
    name: settle
  config:
    # Local secrets file (KEY=value), gitignored. Real env vars take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      separator: "@@"
  servlet:
    multipart:
      max-file-size: 1MB
  ai:
    openai:
      # Google Gemini through its OpenAI-compatible endpoint:
      # base-url + completions-path = https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:missing}
      chat:
        completions-path: ${LLM_COMPLETIONS_PATH:/v1beta/openai/chat/completions}
        options:
          model: ${GEMINI_MODEL:gemini-flash-latest}
          # Room for (hidden) thinking + tool calls + the final JSON.
          max-tokens: 8192
          # Low temperature for reproducible JSON answers.
          temperature: 0.2

server:
  # 8080 is taken by a local llama-server on the dev machine; the Angular UI calls 8081.
  port: ${SERVER_PORT:8081}

settle:
  wiki-dir: ../wiki
  # 1 demo minute = this many real seconds. scenarios.json "after" is in demo minutes:
  # first reply (ACK/NAK) at 1 = 15s, then each MT548 status change every 2 = 30s.
  demo-minute-seconds: 15
  # Gemma rounds take 4-20s (the final answer can take 50s+) and an investigation needs ~5-8 rounds
  llm-timeout-seconds: 180
  # Gemini 3 thinks at high effort by default (slow); low keeps an investigation well under the timeout.
  llm-reasoning-effort: ${GEMINI_REASONING_EFFORT:low}
  readonly:
    username: ${DB_READONLY_USER:}
    password: ${DB_READONLY_PASSWORD:}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 1.0
  environment: hackathon
  release: settle@0.1.0

nimble:
  api-key: ${NIMBLE_API_KEY:}
  base-url: ${NIMBLE_BASE_URL:https://api.nimbleway.com}

logging:
  # Written relative to where the app is started (backend/) -> backend/logs/settle.log, rolls at 10MB
  file:
    name: logs/settle.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
