spring:
  application:
    name: settle
  config:
    # Local secrets file (KEY=value), gitignored. Real env vars take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      separator: "@@"
  servlet:
    multipart:
      max-file-size: 1MB
  ai:
    openai:
      # Full endpoint = base-url + completions-path = https://integrate.api.nvidia.com/v1/chat/completions
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:missing}
      chat:
        completions-path: /v1/chat/completions
        options:
          model: ${NVIDIA_MODEL:google/gemma-4-31b-it}
          # Room for reasoning + tool calls + final JSON (1024 got used up entirely by thinking).
          max-tokens: 4096
          # Low temperature for reproducible JSON answers (the NVIDIA playground sample uses 1).
          temperature: 0.2
          top-p: 0.95
          frequency-penalty: 0
          presence-penalty: 0
          seed: 0

settle:
  wiki-dir: ../wiki
  # 1 demo minute = this many real seconds
  demo-minute-seconds: 10
  llm-timeout-seconds: 30
  # Sent as "chat_template_kwargs": {"enable_thinking": ...}. With thinking on, models like gemma-4 can spend
  # all tokens on reasoning_content and return content = null, so it is off by default.
  llm-enable-thinking: ${NVIDIA_ENABLE_THINKING:false}
  readonly:
    username: ${DB_READONLY_USER:}
    password: ${DB_READONLY_PASSWORD:}
